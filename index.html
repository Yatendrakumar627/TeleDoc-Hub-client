<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23185844' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z'/><polyline points='14 2 14 8 20 8'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeleDoc Hub — Zero-Cost Document Reader & Vault</title>
    <!-- Google Fonts for Document Reader typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    <style>
      /* Pre-hydration Instant Branded Splash (Eliminates white blank flashes) */
      #teledoc-initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f9f7f2;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: #102F27;
        z-index: 99999;
      }
      .teledoc-splash-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 32px 40px;
        background: #ffffff;
        border: 1px solid #e5dfd5;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(16, 47, 39, 0.08);
        text-align: center;
        max-width: 360px;
      }
      .teledoc-splash-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #185844 0%, #102F27 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 14px rgba(24, 88, 68, 0.3);
        animation: teledocPulse 1.8s ease-in-out infinite;
      }
      .teledoc-splash-icon svg {
        width: 24px;
        height: 24px;
        stroke: #eedebd;
      }
      .teledoc-splash-title {
        font-size: 17px;
        font-weight: 700;
        color: #102F27;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .teledoc-splash-sub {
        font-size: 12px;
        color: #63776e;
        margin: 0;
        line-height: 1.4;
      }
      .teledoc-splash-bar {
        width: 140px;
        height: 3px;
        background-color: #edf4f0;
        border-radius: 99px;
        overflow: hidden;
        position: relative;
        margin-top: 6px;
      }
      .teledoc-splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #185844, #B08A4F);
        border-radius: 99px;
        animation: teledocProgress 1.4s ease-in-out infinite;
      }
      @keyframes teledocProgress {
        0% { left: -45%; }
        50% { left: 45%; }
        100% { left: 105%; }
      }
      @keyframes teledocPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Branded Splash (Replaced immediately when React mounts) -->
      <div id="teledoc-initial-splash">
        <div class="teledoc-splash-card">
          <div class="teledoc-splash-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
          <h1 class="teledoc-splash-title">TeleDoc Hub</h1>
          <p class="teledoc-splash-sub">Initializing Zero-Knowledge Vault Session...</p>
          <div class="teledoc-splash-bar"></div>
        </div>
      </div>
    </div>

    <!-- Resilience Script: Catches stale Vite module syntax/network errors and recovers automatically -->
    <script>
      (function() {
        window.__teledocMounted = false;

        // Auto-recover if an unhandled module syntax or chunk error occurs before React mounts
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) ? event.message : '';
          var filename = (event && event.filename) ? event.filename : '';
          console.warn('[TeleDoc Startup Guard] Caught module error:', msg, filename);

          var isModuleOrSyntaxError = (
            msg.indexOf('SyntaxError') !== -1 ||
            msg.indexOf('does not provide an export') !== -1 ||
            msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
            msg.indexOf('Loading chunk') !== -1
          );

          if (isModuleOrSyntaxError && !window.__teledocMounted) {
            var reloadCount = parseInt(sessionStorage.getItem('teledoc_startup_reload_count') || '0', 10);
            if (reloadCount < 2) {
              sessionStorage.setItem('teledoc_startup_reload_count', (reloadCount + 1).toString());
              console.info('[TeleDoc Startup Guard] Stale module version detected. Auto-refreshing cleanly...');
              setTimeout(function() {
                window.location.reload();
              }, 120);
            } else {
              // If repeated, show emergency clean-cache button
              var splash = document.getElementById('teledoc-initial-splash');
              if (splash) {
                splash.innerHTML = (
                  '<div class="teledoc-splash-card">' +
                    '<div class="teledoc-splash-icon" style="background:#fee2e2;">' +
                      '<svg viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
                    '</div>' +
                    '<h1 class="teledoc-splash-title">Update Vault Cache</h1>' +
                    '<p class="teledoc-splash-sub">A newer application version is available. Click below to refresh your browser cache.</p>' +
                    '<button onclick="sessionStorage.clear(); window.location.reload(true);" style="margin-top:10px;padding:8px 18px;background:#185844;color:#ffffff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Refresh Now</button>' +
                  '</div>'
                );
              }
            }
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
